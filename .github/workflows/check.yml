name: Bridge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check distribution
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, re
          root = pathlib.Path('.')
          manifest = (root / 'fxmanifest.lua').read_text()
          version = re.search(r"^version\s+['\"]([^'\"]+)", manifest, re.M).group(1)
          assert json.loads((root / 'version.json').read_text())['version'] == version, 'Version mismatch'
          for path in re.findall(r"['\"]([^'\"]+\.(?:lua|js|html|css))['\"]", manifest):
              if not path.startswith('@'):
                  assert (root / path).is_file(), 'Missing manifest file: ' + path
          print('Manifest files and version OK')
          PYTHON
      - name: Lua syntax
        run: |
          set -eu
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done
      - name: Radial callback regression
        run: |
          lua5.4 - <<'LUA'
          local api, handlers, shown = {}, {}, {}
          local owner, calls = 'ts_nohelmet', 0
          function exports(name, fn) api[name] = fn end
          function GetInvokingResource() return owner end
          function GetCurrentResourceName() return 'ts_bridge' end
          function GetResourceState() return 'started' end
          function AddEventHandler(name, fn) handlers[name] = fn end
          TSBridgeConfig = { Radial = { Enabled = true, Provider = 'ox_lib' } }
          lib = {
              addRadialItem = function(data) shown[data.id] = data end,
              removeRadialItem = function(id) shown[id] = nil end
          }
          dofile('client/radial_actions.lua')
          local callback = setmetatable({}, { __call = function() calls = calls + 1 end })
          local data = { id = 'shuffle', label = 'Wissel voorstoel', onSelect = callback }
          assert(api.RegisterRadialAction(data), 'Callable export callback rejected')
          shown['ts_nohelmet:action:shuffle'].onSelect()
          assert(calls == 1, 'Callback not invoked')
          owner = 'other_resource'
          assert(not api.RemoveRadialAction('shuffle'), 'Foreign action removed')
          owner = 'ts_nohelmet'
          assert(api.RemoveRadialAction('shuffle'))
          assert(shown['ts_nohelmet:action:shuffle'] == nil)
          data.onSelect = {}
          assert(not api.RegisterRadialAction(data), 'Invalid callback accepted')
          data.onSelect = function() calls = calls + 1 end
          assert(api.RegisterRadialAction(data))
          shown['ts_nohelmet:action:shuffle'].onSelect()
          assert(calls == 2)
          handlers.onClientResourceStop('ts_nohelmet')
          assert(shown['ts_nohelmet:action:shuffle'] == nil)
          TSBridgeConfig.Radial.Enabled = false
          assert(api.RegisterRadialAction(data))
          assert(shown['ts_nohelmet:action:shuffle'] == nil)
          print('Radial callback regression OK')
          LUA
      - name: JavaScript syntax
        run: |
          set -eu
          find server web -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
