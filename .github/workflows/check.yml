name: Bridge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check distribution
        run: python3 tools/check_package.py
      - name: Lua regressions
        run: |
          set -eu
          for test in tests/*_spec.lua; do lua5.4 "$test"; done
      - name: JavaScript upload regressions
        run: node --test tests/screenshot_upload_spec.js
